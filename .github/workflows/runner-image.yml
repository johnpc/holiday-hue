name: Runner image

# Builds the umbrel runner image and pushes it to GHCR whenever anything it
# bundles changes on main. Deploying it is a pull on the umbrel box (see
# runner/compose.yaml + CLAUDE.md). The image contains NO secrets — creds come
# from the stack's .env at run time.
on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - 'src/domain/**'
      - 'amplify/data/resource.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runner-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runner-image
  cancel-in-progress: false

jobs:
  build:
    name: Build & push ghcr.io/johnpc/holiday-hue-runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: RUNNER_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/johnpc/holiday-hue-runner:main
            ghcr.io/johnpc/holiday-hue-runner:${{ github.sha }}
