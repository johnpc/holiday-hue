# Dockge stack for the umbrel box. No `ports:` — the runner is outbound-only.
# Everything comes from the stack's .env (never committed): RUNNER_USERNAME,
# RUNNER_PASSWORD, HUE_APP_KEY, and AMPLIFY_OUTPUTS_JSON (the backend's
# amplify_outputs.json on one line — Dockge's dind can't bind-mount a stack file).
services:
  runner:
    image: ghcr.io/johnpc/holiday-hue-runner:main
    container_name: holiday-hue-runner
    restart: unless-stopped
    environment:
      RUNNER_USERNAME: ${RUNNER_USERNAME:?set in .env}
      RUNNER_PASSWORD: ${RUNNER_PASSWORD:?set in .env}
      HUE_BRIDGE_IP: ${HUE_BRIDGE_IP:-192.168.4.47}
      HUE_APP_KEY: ${HUE_APP_KEY:?set in .env}
      AMPLIFY_OUTPUTS_JSON: ${AMPLIFY_OUTPUTS_JSON:?set in .env}
